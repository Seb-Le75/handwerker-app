services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: handwerker
      POSTGRES_USER: handwerker
      POSTGRES_PASSWORD: handwerker_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handwerker -d handwerker"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - handwerker_postgres_data:/var/lib/postgresql/data

volumes:
  handwerker_postgres_data:
